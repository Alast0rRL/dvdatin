{% if total_pages > 1 %}
    {% if page > 1 %}
    <a href="{{ url_for('dashboard.index', page=page-1, decision=decision_filter) }}" class="btn btn-page">← Назад</a>
    {% endif %}
    <span class="page-info">{{ page }} / {{ total_pages }}</span>
    {% if page < total_pages %}
    <a href="{{ url_for('dashboard.index', page=page+1, decision=decision_filter) }}" class="btn btn-page">Далее →</a>
    {% endif %}
{% endif %}
