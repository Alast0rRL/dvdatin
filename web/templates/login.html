<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DvAI — Вход</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23635bff'/%3E%3Cpath d='M16 23.5C16 23.5 8 18.6 8 12c0-2.8 2.2-5 5-5 1.8 0 3 1 3 3 0-2 1.2-3 3-3 2.8 0 5 2.2 5 5 0 6.6-8 11.5-8 11.5Z' fill='%23fff'/%3E%3C/svg%3E">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body class="login-body">
    <div class="login-container">
        <div class="login-card">
            <div class="login-logo">
                <svg xmlns="http://www.w3.org/2000/svg" width="28" height="28" viewBox="0 0 32 32">
                    <path d="M16 25C16 25 7 19.5 7 12.4 7 9.4 9.4 7 12.4 7c1.9 0 3.1 1 3.6 2.8.5-1.8 1.7-2.8 3.6-2.8 3 0 5.4 2.4 5.4 5.4C25 19.5 16 25 16 25Z" fill="#fff"/>
                </svg>
            </div>
            <h1 class="login-title">DvAI</h1>
            <p class="login-subtitle">Вход в панель управления</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="flash flash-{{ category }}">{{ message }}</div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('auth.login') }}">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <div class="form-group">
                    <label class="form-label" for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="Введите пароль" autofocus required class="form-input" autocomplete="current-password">
                </div>
                <button type="submit" class="btn btn-primary btn-full">Войти</button>
            </form>
        </div>
    </div>
</body>
</html>
