<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}DvAI{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <a href="{{ url_for('dashboard.index') }}">DvAI</a>
        </div>
        <div class="nav-links">
            <a href="{{ url_for('dashboard.index') }}" class="{% if request.endpoint and 'dashboard' in request.endpoint %}active{% endif %}">Лента</a>
            <a href="{{ url_for('settings.settings') }}" class="{% if request.endpoint and 'settings' in request.endpoint %}active{% endif %}">Настройки</a>
            <form method="POST" action="{{ url_for('auth.logout') }}" class="inline-form">
                <input type="hidden" name="csrf_token" value="{{ csrf_token }}">
                <button type="submit" class="btn-link">Выйти</button>
            </form>
        </div>
    </nav>

    <main class="container">
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="flash flash-{{ category }}">{{ message }}</div>
                {% endfor %}
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <script src="{{ url_for('static', filename='js/app.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
