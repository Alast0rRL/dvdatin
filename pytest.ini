[pytest]
# Невызванная корутина (забытый await, AsyncMock на синхронном методе
# Telethon) — ошибка теста, а не предупреждение. Предупреждение возникает
# при сборке мусора, поэтому pytest оборачивает его в
# PytestUnraisableExceptionWarning — её тоже делаем ошибкой.
filterwarnings =
    error::RuntimeWarning
    error::pytest.PytestUnraisableExceptionWarning
