# ============================================================
# DvAI — предпочтения пользователя для AI scoring
#
# ЭТО ПРИМЕР. Скопируй в config/preferences.yaml (gitignored) и
# перезаписывай там свои правила. Логика никак не зашита в код —
# только здесь (и в серверном LLM-промпте).
#
# match: подстроки в тексте анкеты (учитывается lowercase).
# Любое совпадение SKIP  → решение DISLIKE (hard).
# Любое совпадение LIKE  → потенциальный DISLIKE подтягивается до REVIEW
#                          (не теряется), при высоком combined → LIKE.
# Пороги 0.75/0.50 не меняются.
# ============================================================

# SIGNALS → DISLIKE (жёсткие негативы)
skip:
  - label: "не ищет отношений"
    match:
      - "ищу друга"
      - "ищу подругу"
      - "пообщаться и возможно"
      - "ищу человечка пообщаться"
      - "ищу кого-нибудь пообщаться"
      - "без отношений"
      - "не ищу отношения"
      - "ищу друзей и"
  - label: "есть парень"
    match:
      - "есть парень"
      - "мой парень"
      - "с парнем"
      - "у меня парень"
  - label: "курит"
    match:
      - "курю"
      - "курит"
      - "курение"
      - "сигарет"
  - label: "пьёт"
    match:
      - "пью"
      - "пьёт"
      - "алкогол"
      - "вино"
      - "пиво"
      - "водк"
      - "выпива"
      - "бахаю"
  - label: "вредные привычки"
    match:
      - "вредные привычки"
      - "вредн"
  - label: "покатайте/покатушки"
    match:
      - "покатайте"
      - "покатать"
      - "покатуш"
      - "прокат"
      - "подвезти"
  - label: "волосы короче каре"
    match:
      - "под каре"
      - "короткая стрижка"
      - "короче каре"

# SIGNALS → подъём (like-факторы)
like:
  - label: "СПбПУ"
    match:
      - "спбпу"
      - "политех"
      - "спбау"
      - "лэти"
      - "итимо"
  - label: "аниме"
    match:
      - "аниме"
      - "анимеш"
      - "манга"
  - label: "игры"
    match:
      - "играю в"
      - "играть в"
      - "игры"
      - "гейм"
      - "дота"
      - "майнкрафт"
      - "пабг"
      - "стрим"
      - "компьютерные игры"
      - "кооп"
  - label: "переехала в СПб"
    match:
      - "переехала"
      - "перееха"
      - "недавно в питер"
      - "недавно переехала"

# Тонкая настройка (не трогаем пороги 0.75/0.50)
scoring:
  skip_is_hard: true            # SKIP → DISLIKE, CLIP не переворачивает
  like_lifts_review: true       # LIKE-фактор → DISLIKE подтягивается до REVIEW
  clip_cannot_override_skip: true
