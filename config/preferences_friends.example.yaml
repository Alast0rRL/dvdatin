# ============================================================
# DvAI — правила режима «кенты» (аккаунт ищет парней-друзей)
#
# ЭТО ПРИМЕР. Скопируй в config/preferences_friends.yaml (gitignored).
# Путь задаётся в config.yaml: friends.preferences_file.
#
# Формат тот же, что у preferences.yaml (правила для девушек), но
# встроенные «девичьи» признаки (курит, «есть парень», «ищу друга»…)
# и фото-модель на этом аккаунте НЕ работают — решают только эти правила,
# фильтр friends.filters (возраст/город) и объём анкеты.
#
# skip      — совпадение → 👎.
# like_hard — совпадение → лайк 💌 (даже короткая анкета), skip главнее.
# Поиск — по подстроке: «зал» поймал бы «сказал», поэтому «в зал», «спортзал».
# like      — только отметка в причинах (на решение не влияет).
# Анкета без совпадений: информативная → лайк, короткая → тебе на сайт
# (или 👎 при low_info.action: skip).
# ============================================================

skip:
  - label: "ищет девушку / отношения"
    match:
      - "ищу девушку"
      - "ищу девушк"
      - "ищу вторую половин"
      - "ищу свою половин"
      - "ищу любовь"
      - "ищу отношени"
      - "серьезные отношения"
      - "серьёзные отношения"
      - "для отношений"
      - "познакомлюсь с девушкой"
  - label: "продажи / реклама / заработок"
    match:
      - "заработ"
      - "доход"
      - "инвест"
      - "крипт"
      - "трейд"
      - "арбитраж"
      - "бизнес-предложен"
      - "подпишись"
      - "подписывайся"
      - "мой канал"
      - "в канале"
      - "t.me/"
      - "http"
      - "промокод"
      - "скидк"
      - "продаю"
      - "реклама"
  - label: "вирт / 18+ / поиск партнёра"
    match:
      - "вирт"
      - "18+"
      - "интим"
      - "секс"
      - "без обязательств"
      - "пассив"
      - "актив "
      - "универсал"
      - " би "
      - "лгбт"
      - "ищу парня"
      - "для встреч"
      - "фото за фото"

like_hard:
  - label: "спорт / зал"
    match:
      - "в зал"
      - "в зале"
      - "спортзал"
      - "качалк"
      - "качаюсь"
      - "тренажер"
      - "тренажёр"
      - "тренир"
      - "спорт"
      - "фитнес"
      - "кроссфит"
      - "бегаю"
      - "бегом"
      - "пробежк"
      - "футбол"
      - "баскетбол"
      - "волейбол"
      - "единоборств"
      - "бокс"
      - "турник"
      - "воркаут"
      - "велик"

like: []

low_info:
  action: review
