# ============================================
# DvAI Configuration
# ============================================

telegram:
  # Один или несколько аккаунтов. Каждый аккаунт — отдельная Telegram-сессия
  # (файл data/sessions/<session>.session). Один и тот же чат, увиденный
  # разными аккаунтами, дедуплицируется (in-memory + UNIQUE в БД) и
  # обрабатывается ровно один раз.
  # Допускается и старый формат — одиночный словарь без ключа `accounts:`.
  accounts:
    - api_id: 0
      api_hash: ""
      phone: ""
      session: dvai_1          # имя session-файла (без расширения)

      proxy:
        enabled: false
        type: socks5
        host: ""
        port: 0
        username: ""
        password: ""

    - api_id: 0
      api_hash: ""
      phone: ""
      session: dvai_2

      proxy:
        enabled: false
        type: socks5
        host: ""
        port: 0
        username: ""
        password: ""

project:
  mode: OBSERVE

dvinchik:
  chat_id: 1234060895   # Дайвинчик (Leo)

# Allowlist источников. Сообщения из любых других чатов игнорируются ДО обработки.
sources:
  allowed_chat_ids:
    - 1234060895        # Дайвинчик (Leo) — единственный разрешённый источник

filters:
  age:
    min: 17
    max: 20
  city:
    # Пустой список = городской фильтр выключен (любой город проходит).
    # Чтобы ограничить: allowed: ["Санкт-Петербург", "Москва"] и т.д.
    allowed: []

# Детерминированный scoring (Stage 8). Решение выносится ВСЕГДА, для каждого
# профиля: пороги решают, LIKE/REVIEW/DISLIKE. Правила признаков — в preferences.
ai:
  decision:
    like_threshold: 0.75       # score >= + positive factors → LIKE
    review_threshold: 0.50     # score >= → REVIEW
    scoring_version: "deterministic-v2"

# Stage 7 (SEMI_AUTO): авто-действия на анкетах (отправка ❤️/👎).
# Работает только при project.mode: SEMI_AUTO (или AUTO) + enabled: true.
# account_session — ОСНОВНОЙ аккаунт: его чат в ленте сайта, с него ручные
#   ❤️/👎 и ответы на капчи с сайта, им управляет ControlBot.
# account_modes — режим КАЖДОГО аккаунта отдельно ({session: OBSERVE|SEMI_AUTO|
#   AUTO}): у каждого аккаунта свой движок, ленту можно листать сразу на двух.
#   Нет записи → у основного project.mode, у остальных OBSERVE. Пишется сайтом
#   (строки аккаунтов в шапке).
# interval_sec — интервал между действиями. Держи МАЛЫМ (по умолчанию 2 с):
#   Leo принимает ❤️/👎 только пока карточка на экране, а ленту листает сам
#   (~каждые 2–10 с). При 10 с реакция уезжала на 1–3 карточки вперёд.
#   Устаревшую карточку движок не трогает (is_stale_card) — лучше пропуск,
#   чем лайк/дизлайк не той девушке.
# notify_chat_id — chat_id (user_id) для уведомлений: пересылка карточки анкеты
#   с объяснением причины лайка/дизлайка. 0 — авто: на «другой» аккаунт из
#   telegram.accounts (с авто-аккаунта на второй).
# notify_dislikes — пересылать ли и анкеты с 👎 (каждые ~2 с при живой ленте).
#   false — приходят только лайки и «нужно твоё решение».
# like / like_message — ОТДЕЛЬНЫЕ настройки (принцип Decision != Action):
#   Голого лайка без сообщения НЕТ (LIKE_ONLY удалён): LIKE всегда означает
#   цепочку «Берем)» — сначала ❤️, потом текст из like_message.text.
#   like.enabled — слать ❤️ (первый шаг цепочки);
#   like_message.enabled + text — слать «Берем)» после ❤️. Если выключен
#   любой из двух флагов — лайк НЕ отправляется вовсе (NO_ACTION), голого
#   ❤️ не остаётся.
auto_actions:
  enabled: false
  account_session: "dvai_2"
  # account_modes:
  #   dvai: OBSERVE
  #   dvai_2: SEMI_AUTO
  interval_sec: 2.0
  notify_chat_id: 0
  notify_dislikes: true

  like:
    enabled: true

  like_message:
    enabled: true
    text:                    # строка или список; из пула выбирается случайный вариант
      - "Беру)"
      - "Берем😍"

  # Память капч (Stage 7.6): капчу Leo, ответ на которую бот выучил, он
  # пробивает автоматически; неизвестную — выводит в блок капч на главном
  # экране (/), владелец отвечает, ответ запоминается и применяется в
  # следующий раз.
  # fallback_press_last: на неизвестную капчу всё равно жать последнюю
  # обычную кнопку (старое поведение), а не ждать ответа владельца.
  captcha:
    enabled: true
    auto_answer: true
    fallback_press_last: false

  # Взаимный лайк («Начинай общаться 👉 [Имя]»): бот сам пишет девушке в
  # личку — только стикер (текст Leo «Привет! Я с Дайвинчика ✨» не шлётся).
  # Всем матчам: и после лайка бота, и после твоего ручного (любой режим),
  # с того аккаунта, где матч. Один раз на девушку; есть переписка — не пишет.
  match_greeting:
    enabled: true
    modes: ["OBSERVE", "SEMI_AUTO", "AUTO"]
    sticker_set: "Flame"           # t.me/addstickers/Flame
    sticker_emojis: ["👋", "🔥"]   # первый стикер с таким эмодзи
    sticker_index: -1              # >= 0 — взять стикер по номеру в наборе
  # Автопереписка (режим AUTO): девушка ответила на стикер → через delay_min
  # минут бот пересылает ей её же анкету из чата Leo и закрепляет у обоих.
  match_intro:
    enabled: true
    modes: ["AUTO"]
    delay_min: 30
    pin: true
    reply_check_hours: 72          # сверка ответа по истории (после рестарта)

# Stage 7.5: панель управления режимом через Telegram-бота (ControlBot).
# Команды /status /on /off /stream /recent /help — только от allowed_user_ids.
# Слушает ВСЕ аккаунты из telegram.accounts; команды принимаются от перечисленных
# user_id (оба аккаунта-оператора), ответ шлётся с того же аккаунта, что получил.
control:
  enabled: false
  allowed_user_ids:
    - 8525808108     # user_id аккаунта Бармалей (accounts[1], авто-аккаунт)
    - 1753676469     # user_id аккаунта melancholic (accounts[0])

# Stage 8: ручное ревью REVIEW-анкет.
# Когда scoring выдаёт REVIEW (бот «не справляется»), бот НЕ действует сам:
# уведомляет владельца, что нужно его решение, и ждёт ручного действия в
# Дайвинчике (❤️/👎/сообщение с того же аккаунта). Пойманное действие
# привязывается к REVIEW-анкете и дописывается в файл (JSON или Markdown).
manual_review:
  enabled: false
  file: "data/reviews/review_log.json"   # data/reviews/review_log.md для Markdown
  format: json                            # json | md

# Проверка фото на сигареты/вейп/алкоголь (CLIP локально). Только для анкет,
# которые бот собирается лайкнуть: уверенно найдено → 👎 (причина PHOTO_VICE).
# Нужны torch + open_clip_torch (pip install -r requirements-ml.txt).
photo_check:
  enabled: false
  smoke_threshold: 0.99
  alcohol_threshold: 0.97
  max_photos: 4
  threads: 4

# Модель вкуса по фото — ТЕНЕВОЙ режим: вердикт пишется в photo_scores,
# действия бота не меняются. Веса обучены на разметке /rate (не в git).
photo_taste:
  enabled: false
  model_path: "data/ml/taste_model.json"
  mode: shadow             # shadow — только вердикт; decide — модель решает лайк
  like_share: 0.20         # decide: лайкаем верхние 20% анкет по вкусу
  max_photos: 3            # CLIP на CPU ~1.5 с на фото
  max_pending: 20
  backfill: true           # фоновый досчёт старых анкет (вердикт + отпечаток)
  backfill_pause_sec: 2.0

logging:
  level: INFO
