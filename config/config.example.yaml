# ============================================
# DvAI Configuration
# ============================================

telegram:
  # Один или несколько аккаунтов. Каждый аккаунт — отдельная Telegram-сессия
  # (файл data/sessions/<session>.session). Один и тот же чат, увиденный
  # разными аккаунтами, дедуплицируется (in-memory + UNIQUE в БД) и
  # обрабатывается ровно один раз.
  # Допускается и старый формат — одиночный словарь без ключа `accounts:`.
  accounts:
    - api_id: 0
      api_hash: ""
      phone: ""
      session: dvai_1          # имя session-файла (без расширения)

      proxy:
        enabled: false
        type: socks5
        host: ""
        port: 0
        username: ""
        password: ""

    - api_id: 0
      api_hash: ""
      phone: ""
      session: dvai_2

      proxy:
        enabled: false
        type: socks5
        host: ""
        port: 0
        username: ""
        password: ""

project:
  mode: OBSERVE

dvinchik:
  enabled: true
  chat_id: 1234060895   # Дайвинчик (Leo)

# Allowlist источников. Сообщения из любых других чатов игнорируются ДО обработки.
sources:
  allowed_chat_ids:
    - 1234060895        # Дайвинчик (Leo) — единственный разрешённый источник

filters:
  age:
    min: 18
    max: 19
  city:
    allowed:
      - "Санкт-Петербург"

ai:
  enabled: true                # Включить детерминированный scoring (Stage 8)
  backend: "local"
  scoring:
    # Веса для ScoreEngine (детерминированный)
    base_score: 0.5            # Базовый score без признаков (REVIEW)
    positive_weight: 0.10      # Бонус за каждый positive factor
    positive_cap: 0.35         # Макс. бонус за все positive factors
    negative_penalty: 0.50     # Штраф за hard negative
  decision:
    like_threshold: 0.75       # score >= + positive factors → LIKE
    review_threshold: 0.50     # score >= → REVIEW
    min_confidence: 0.60
    scoring_version: "deterministic-v2"
    weights:
      llm: 0.7
      clip: 0.3
  remote:
    base_url: "http://144.31.139.206:8000"
    timeout: 90
    max_retries: 1
    api_key: ""
  images:
    enabled: false             # CLIP отключён (детерминированный scoring не использует фото)

limits:
  max_likes_per_day: 40
  min_delay_minutes: 90
  max_delay_minutes: 240

# Stage 7 (SEMI_AUTO): авто-действия на анкетах (отправка ❤️/👎).
# Работает только при project.mode: SEMI_AUTO (или AUTO) + enabled: true.
# account_session — сессия аккаунта, от имени которого шлём действия.
# interval_sec — интервал между действиями (6/мин ≈ 10 сек).
# notify_chat_id — chat_id (user_id) для уведомлений: пересылка карточки анкеты
#   с объяснением причины лайка/дизлайка. 0 — уведомления выключены.
auto_actions:
  enabled: false
  account_session: "dvai_2"
  interval_sec: 10.0
  # Оставьте пустым: клиент не определяет безопасное состояние для команды.
  start_command: ""
  notify_chat_id: 0

# Stage 7.5: панель управления режимом через Telegram-бота (ControlBot).
# Команды /status /on /off /stream /recent /help — только от allowed_user_ids.
# Работает на telegram.accounts[0]; режим меняется на лету и сохраняется в config.yaml.
control:
  enabled: false
  allowed_user_ids:
    - 8525808108     # ваш собственный account-id (оператор)

# Stage 8: ручное ревью REVIEW-анкет.
# Когда scoring выдаёт REVIEW (бот «не справляется»), бот НЕ действует сам:
# уведомляет владельца, что нужно его решение, и ждёт ручного действия в
# Дайвинчике (❤️/👎/сообщение с того же аккаунта). Пойманное действие
# привязывается к REVIEW-анкете и дописывается в файл (JSON или Markdown).
manual_review:
  enabled: false
  file: "data/reviews/review_log.json"   # data/reviews/review_log.md для Markdown
  format: json                            # json | md

logging:
  level: INFO
